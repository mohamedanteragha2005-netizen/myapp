<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

        }
        p {
            color: #4a4a4a;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .footer-text {
            font-size: 12px;
