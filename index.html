<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اعتذار</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4ebf5 100%);
    font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #fff4e5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  h1 {
    font-size: 22px;
    color: #2d2d2d;
    margin-bottom: 16px;
  }
  p {
    font-size: 16px;
    line-height: 1.9;
    color: #555;
    margin-bottom: 12px;
  }
  .footer {
    margin-top: 24px;
    font-size: 14px;
    color: #999;
    border-top: 1px solid #eee;
    padding-top: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>نعتذر عن هذا الإزعاج</h1>
    <p>نعتذر عن وصول هذا الإعلان إليك دون علم المستخدم.</p>
    <p>هذا الرابط خاص بالشركة، ونعتذر جيدًا عن وصولك إلى هذا الإعلان.</p>
    <p>تم حدوث مشكلة في النظام وتم إرساله بالطريق الخطأ، وهذا الرابط مخصص للإعلان.</p>
    <p>شكرًا لك</p>
    <div class="footer">عنتر اغا</div>
  </div>
</body>
        </html>
